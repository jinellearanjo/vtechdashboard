# Keeps the free-tier Supabase project from being auto-paused for inactivity (7 days without API
# requests), and doubles as an alarm: if the project is paused or down, this run fails and GitHub
# emails you.
#
# Setup (once): repo → Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL       e.g. https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY  the project's anon / publishable key (already public in the built site)
#
# Note: GitHub disables scheduled workflows after ~60 days without repo activity; if pings stop,
# re-enable this workflow from the Actions tab (or push any commit).

name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * 1,4'   # Monday and Thursday, 06:17 UTC
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set." >&2
            exit 1
          fi

          # A real query against the database. The anon role sees no rows (RLS), which is fine:
          # any answer below 500 proves the project is awake and serving requests.
          status=$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1") || {
              echo "Request failed (project paused or unreachable?)." >&2
              exit 1
            }

          echo "HTTP $status"
          if [ "$status" -ge 500 ] || [ "$status" -eq 000 ]; then
            echo "Supabase did not answer properly (status $status). It may be paused." >&2
            exit 1
          fi
